name: IRCTC Automation Booking

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      USERNAME:
        required: true
        type: string
        description: "Your IRCTC Username"

      PASSWORD:
        required: true
        type: string
        description: "Your IRCTC Password"

      UPI_ID:
        required: true
        type: string
        description: "Your UPI ID To Make Payment From"

jobs:
  IRCTC-Booking:
    runs-on: [self-hosted, macOS, irctc-india]

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Install CAPTCHA solver dependencies
      # --------------------------------------------------
      - name: Install Python dependencies
        run: |
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m venv .venv
          .venv/bin/pip install -r irctc-captcha-solver/requirements.txt

      # --------------------------------------------------
      # Start CAPTCHA solver
      # --------------------------------------------------
      - name: Start CAPTCHA server
        run: |
          .venv/bin/python irctc-captcha-solver/app-server.py \
            --host 0.0.0.0 \
            --port 5000 > captcha-server.log 2>&1 &

          echo $! > captcha-server.pid

          echo "Waiting for CAPTCHA server..."

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5000 > /dev/null; then
              echo "CAPTCHA server is running on port 5000"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "CAPTCHA server failed to start"
              echo "===== CAPTCHA SERVER LOG ====="
              cat captcha-server.log || true
              exit 1
            fi

            sleep 1
          done

      # --------------------------------------------------
      # Install Cypress / Node dependencies
      # --------------------------------------------------
      - name: Install Node dependencies
        run: |
          npm install

      # --------------------------------------------------
      # Run Cypress
      # --------------------------------------------------
      - name: Run IRCTC Cypress Automation
        env:
          CYPRESS_USERNAME: ${{ inputs.USERNAME || secrets.USERNAME }}
          CYPRESS_PASSWORD: ${{ inputs.PASSWORD || secrets.PASSWORD }}
          CYPRESS_UPI_ID: ${{ inputs.UPI_ID || secrets.UPI_ID }}
        run: |
          npx cypress run \
            --browser chrome \
            --env "UPI_ID=${CYPRESS_UPI_ID},USERNAME=${CYPRESS_USERNAME},PASSWORD=${CYPRESS_PASSWORD}" \
            --reporter spec

      # --------------------------------------------------
      # Show CAPTCHA logs if anything fails
      # --------------------------------------------------
      - name: Show CAPTCHA server logs on failure
        if: failure()
        run: |
          echo "===== CAPTCHA SERVER LOG ====="
          cat captcha-server.log || true

      # --------------------------------------------------
      # Stop CAPTCHA server (self-hosted runner keeps processes alive)
      # --------------------------------------------------
      - name: Stop CAPTCHA server
        if: always()
        run: kill $(cat captcha-server.pid) 2>/dev/null || true
